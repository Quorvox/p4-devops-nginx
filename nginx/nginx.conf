worker_processes 1;
events { worker_connections 256; }
http {
    include mime.types;
    default_type application/json;
    gzip on;
    gzip_types application/json text/css application/javascript;
    server {
        listen 80;
        resolver 127.0.0.11 valid=10s;  # днс докера, апстрим резолв. в рантайме
        set $api app:8000;
        add_header X-Served-By "p4-nginx" always;
        location /api/ {
            proxy_pass http://$api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            return 200 '{"ok":true,"via":"nginx"}';
        }
    }
}
